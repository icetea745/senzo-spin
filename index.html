<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Senzo RP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { text-align: center; background: rgba(15, 52, 96, 0.9); padding: 40px; border-radius: 20px; border: 3px solid #ff6b6b; max-width: 800px; }
        h1 { color: #ff6b6b; font-size: 2.5em; margin-bottom: 20px; }
        .subtitle { color: #ffd700; font-size: 1.2em; margin-bottom: 40px; }
        .wheels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .wheel-card { background: linear-gradient(135deg, #ff6b6b, #ff4757); padding: 30px; border-radius: 15px; text-decoration: none; color: white; font-weight: bold; font-size: 1.2em; transition: all 0.3s; box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4); border: 2px solid #ffab91; display: flex; flex-direction: column; align-items: center; }
        .wheel-card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 0 20px 50px rgba(255, 107, 107, 0.6); }
        .sub-options { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .sub-option { background: rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 8px; font-size: 0.95em; color: white; border: 1px solid rgba(255,255,255,0.15); text-decoration: none; font-weight: 600; transition: background 0.2s, transform 0.15s; }
        .sub-option:hover { background: rgba(255,255,255,0.18); transform: translateY(-3px); }
        @media (max-width: 600px) { .wheels-grid { grid-template-columns: 1fr; } h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍜 SPIN SENZO RP 🍜</h1>
        <p class="subtitle">Les Roues de la Destinée Ninja</p>
        <div class="wheels-grid">
            <a href="https://spinthewheel.io/fr/wheels/2xzxF7V7WlUJJVPJBE4Ccz0xJmU9MQ==" class="wheel-card" target="_blank">⚡ Element</a>

            <a href="https://spinthewheel.io/fr/wheels/EVDJmjSW9c60FeBA4S1Zcz0xJmU9MQ==" class="wheel-card" target="_blank">🔥 Maitrise</a>

            <div class="wheel-card">
                <a href="https://spinthewheel.io/fr/wheels/GSJR9P5JTw40is0TSbkYcz0xJmU9MQ==" style="color:inherit; text-decoration:none;" target="_blank">💨 Kumo</a>
                <div class="sub-options">
                    <!-- Remplacez les hrefs ci-dessous par les URLs de vos roues/entrées réelles -->
                    <a class="sub-option" href="https://spinthewheel.io/fr/wheels/GSJR9P5JTw40is0TSbkYcz0xJmU9MQ==?entry=hyuga-bs" target="_blank">Hyuga BS</a>
                    <a class="sub-option" href="https://spinthewheel.io/fr/wheels/GSJR9P5JTw40is0TSbkYcz0xJmU9MQ==?entry=hyuga-bp" target="_blank">Hyuga BP</a>
                </div>
            </div>

            <a href="https://spinthewheel.io/fr/wheels/ZxkZSsz3myHIGbZVHxNTcz0xJmU9MQ==" class="wheel-card" target="_blank">💧 Suna</a>
        </div>
    </div>
</body>
</html>
